<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K0RDS (Khaled) Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
<style>
  :root {
    --main: #19766E;
    --dark: #12544E;
    --light: #CDF4F1;
    --white: #FFFFFF;
    --deep: #0A2F2B;

    --bg: var(--light);
    --surface: var(--white);
    --ink: var(--dark);
    --muted: var(--main);
    --accent: var(--main);
    --card-title: var(--main);
    --card-text: var(--main);
    --link: var(--dark);
    --line: color-mix(in srgb, var(--main) 25%, var(--light));
    --placeholder: var(--main);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--deep);
      --surface: var(--dark);
      --ink: var(--light);
      --muted: color-mix(in srgb, var(--light) 80%, var(--dark));
      --accent: var(--light);
      --card-title: var(--light);
      --card-text: color-mix(in srgb, var(--light) 80%, var(--dark));
      --link: color-mix(in srgb, var(--light) 80%, var(--dark));
      --line: color-mix(in srgb, var(--light) 30%, var(--dark));
    }
  }
  * { box-sizing: border-box; }
  html {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px 80px; }
  h1, h2, .fallback { font-family: "Jersey 20", sans-serif; font-weight: 400; }
  h1 { font-size: 3rem; line-height: 1.1; margin: 0 0 8px; }
  .intro { color: var(--muted); margin: 0 0 40px; max-width: 52ch; }

  .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .link {
    display: grid;
    grid-template-columns: 160px 1fr;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
  }
  .link:hover { border-color: var(--accent); }
  .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .thumb {
    width: 100%; height: 100%; min-height: 110px;
    object-fit: cover; display: block;
    background: var(--placeholder);
  }
  .fallback {
    display: grid; place-items: center; min-height: 110px;
    background: var(--placeholder); color: var(--light);
    font-size: 2.6rem; line-height: 1;
  }
  .text { padding: 14px 18px; }
  .text h2 { margin: 0 0 4px; font-size: 1.6rem; line-height: 1.15; color: var(--card-title); }
  .text p { margin: 0 0 6px; color: var(--card-text); font-size: .95rem; }
  .host { font: .8rem/1 system-ui, sans-serif; color: var(--link); }

  @media (max-width: 520px) {
    .link { grid-template-columns: 1fr; }
    .thumb, .fallback { height: 150px; }
  }
</style>
</head>
<body>
<main>
  <h1>Khaled Kottmann - K0RDS</h1>
  <p class="intro">This is a collection of Projects I work on</p>
  <ul class="links" id="links"></ul>
</main>

<script>
  const links = [
    {
      title: "Code on GitHub",
      url: "https://github.com/R4YL0",
      description: "All publicly available projects are live on github.",
      image: "media/yves-barthez-yves-barthez-mario-rabbids-rayman04b.jpg"
    },
    {
      title: "Games on itch.io",
      url: "https://k0rds.itch.io/",
      description: "Red Sand Ranch as well as other Games I work on ;P",
      image: "media/K0RDS-Logo_redesign-10.png"
    },
    {
      title: "Music on SoundCloud",
      url: "https://soundcloud.com/user-583290038",
      description: `Link to “Teenage Thoughts” as well as other Songs I’ve worked on`,
      image: "media/K0RDS.jpg"
    },
    {
      title: "YouTube",
      url: "https://www.youtube.com/@K0RDS",
      description: "I am currently practicing my video editing skills, so I might upload some more vids.",
      image: "media/K0RDS-Logo_redesign-10.png"
    }
  ];

  const list = document.getElementById("links");

  for (const item of links) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "link";
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    const makeFallback = () => {
      const f = document.createElement("div");
      f.className = "fallback";
      f.textContent = item.title.charAt(0).toUpperCase();
      return f;
    };

    let media;
    if (item.image) {
      media = document.createElement("img");
      media.className = "thumb";
      media.src = item.image;
      media.alt = "";
      media.loading = "lazy";
      media.onerror = () => media.replaceWith(makeFallback());
    } else {
      media = makeFallback();
    }

    const text = document.createElement("div");
    text.className = "text";
    const host = new URL(item.url).hostname.replace(/^www\./, "");
    const h2 = document.createElement("h2");
    h2.textContent = item.title;
    const p = document.createElement("p");
    p.textContent = item.description;
    const small = document.createElement("span");
    small.className = "host";
    small.textContent = host;
    text.append(h2, p, small);

    a.append(media, text);
    li.append(a);
    list.append(li);
  }
</script>
</body>
</html>
